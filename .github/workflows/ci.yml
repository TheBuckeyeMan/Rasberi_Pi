name: Rasberi Pi CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev

env:
  DOCKER_IMAGE_NAME: "thebuckeyeman20/smart-home:smart-home-pi"
  ECR_IMAGE_NAME: "${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/smart-home:smart-home-pi"
  BRANCH: "master"

jobs:
  Docker_Build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Building Docker Image
        run: |
          docker build -t $DOCKER_IMAGE_NAME .
    
      - name: Save Docker Image as Artifact
        run: |
          docker save -o image.tar $DOCKER_IMAGE_NAME
            
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar

  Dockerhub_Push:
    runs-on: ubuntu-latest
    needs: Docker_Build
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Logging into Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image to Docker Hub
        run: |
          docker push $DOCKER_IMAGE_NAME

  AWS_ECR_Push:
    runs-on: ubuntu-latest
    needs: Docker_Build
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker Image
        run: |
          docker load -i image.tar

      - name: Re-tag Docker Image for ECR
        run: |
          docker tag $DOCKER_IMAGE_NAME $ECR_IMAGE_NAME

      - name: Configuring AWS Credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set default.region ${{ secrets.AWS_REGION }}
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Pushing Docker Image to ECR
        run: |
          docker push $ECR_IMAGE_NAME

  Install_Code_To_Pi:
    runs-on: ubuntu-latest
    needs: [AWS_ECR_Push , Dockerhub_Push]
    # steps:
    #   - name: SSH into Rasberi Pi
